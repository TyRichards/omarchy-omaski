<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Omaski sprite editor</title>
<style>
  body { font-family: monospace; background: #222; color: #eee; margin: 16px; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .row { margin: 10px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button, select { font-family: monospace; font-size: 14px; padding: 4px 10px; }
  select { min-width: 240px; }
  button.tool { padding: 6px 14px; background: #333; color: #eee; border: 2px solid #555; cursor: pointer; }
  button.tool.on { border-color: #fff; background: #444; }
  button.save { background: #295; color: #fff; border: 2px solid #4c7; font-weight: bold; }
  #palette { display: flex; gap: 4px; flex-wrap: wrap; }
  .swatch {
    width: 30px; height: 30px; border: 2px solid #555; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-weight: bold;
  }
  .swatch.sel { border-color: #fff; outline: 2px solid #fff; }
  #grid { image-rendering: pixelated; cursor: crosshair; border: 1px solid #555; }
  #preview { image-rendering: pixelated; border: 1px solid #555; background: #FFF1E8; }
  .work { display: flex; gap: 16px; align-items: flex-start; }
  textarea { width: 100%; height: 160px; background: #111; color: #0f0; }
  .hint { color: #999; font-size: 12px; }
  #status { color: #7f7; font-size: 13px; min-width: 200px; }
  #status.err { color: #f66; }
</style>
</head>
<body>
<h1>Omaski sprite editor</h1>

<div class="row">
  <select id="pick"></select>
  <button id="prev" title="previous sprite ([)">&#9664; prev</button>
  <button id="next" title="next sprite (])">next &#9654;</button>
  <span id="status"></span>
</div>

<div class="row">
  <button class="tool on" id="pencil" title="P">&#9998; Pencil</button>
  <button class="tool" id="eraser" title="E">&#9723; Eraser</button>
  <div id="palette"></div>
</div>

<div class="row">
  <button class="save" id="save" title="Ctrl+S">&#128190; Save to game</button>
  <button id="revert" title="drop hand edits, back to generated art">Revert to generated</button>
  <button id="copyTo">Copy to &#8594;</button>
  <select id="copyTarget" title="overwrite another sprite with this canvas"></select>
  <button id="mirrorTo" title="flip horizontally, then overwrite">Mirror to &#8594;</button>
  <select id="mirrorTarget" title="overwrite another sprite with the flipped canvas"></select>
  <button id="bg">Background: checker</button>
  <span class="hint">drag = draw &nbsp;|&nbsp; right-drag = erase &nbsp;|&nbsp; Ctrl+Z undo &nbsp;|&nbsp; Ctrl+S save &nbsp;|&nbsp; [ ] prev/next</span>
</div>

<div class="row work">
  <canvas id="grid"></canvas>
  <div>
    <div class="hint">in-game size (3x)</div>
    <canvas id="preview"></canvas>
  </div>
</div>

<details>
  <summary class="hint">ASCII (copy/paste)</summary>
  <div class="row"><button id="copy">Copy ASCII</button>
    <button id="fromText">Load ASCII from box</button></div>
  <textarea id="out" spellcheck="false"></textarea>
</details>

<script>
// Same table as tools/make-sprites.py PALETTE. "." is transparent.
const PALETTE = {
  k: "#000000", n: "#1D2B53", v: "#7E2553", e: "#008751",
  B: "#AB5236", d: "#5F574F", s: "#C2C3C7", w: "#FFF1E8",
  r: "#FF004D", o: "#FFA300", y: "#FFEC27", g: "#00E436",
  b: "#29ADFF", l: "#83769C", m: "#FF77A8", f: "#FFCCAA",
};

let sprites = [];          // [{id, name, group, art, edited}]
let current = null;        // entry from sprites
let grid = [["."]];
let color = "k";
let tool = "pencil";       // "pencil" | "eraser"
let snowBg = false;
let drawing = null;
let undoStack = [];
let dirty = false;

const canvas = document.getElementById("grid");
const ctx = canvas.getContext("2d");
const preview = document.getElementById("preview");
const pctx = preview.getContext("2d");
const out = document.getElementById("out");
const status = document.getElementById("status");
const pick = document.getElementById("pick");

function say(msg, err) {
  status.textContent = msg;
  status.className = err ? "err" : "";
}

// --- palette + tools --------------------------------------------------------
const palDiv = document.getElementById("palette");
for (const ch of Object.keys(PALETTE)) {
  const el = document.createElement("div");
  el.className = "swatch";
  el.dataset.ch = ch;
  el.style.background = PALETTE[ch];
  el.textContent = ch;
  el.style.color = ["k","n","v","e","d"].includes(ch) ? "#fff" : "#000";
  el.title = ch;
  el.onclick = () => { color = ch; setTool("pencil"); selectSwatch(el); };
  palDiv.appendChild(el);
}
function selectSwatch(el) {
  palDiv.querySelectorAll(".swatch").forEach(s => s.classList.remove("sel"));
  if (el) el.classList.add("sel");
}
selectSwatch(palDiv.firstChild);

const pencilBtn = document.getElementById("pencil");
const eraserBtn = document.getElementById("eraser");
function setTool(t) {
  tool = t;
  pencilBtn.classList.toggle("on", t === "pencil");
  eraserBtn.classList.toggle("on", t === "eraser");
}
pencilBtn.onclick = () => setTool("pencil");
eraserBtn.onclick = () => setTool("eraser");

// --- drawing ----------------------------------------------------------------
function pxSize() {
  const m = Math.max(grid[0].length, grid.length);
  return Math.max(6, Math.min(36, Math.floor(680 / m)));
}
function repaint() {
  const P = pxSize(), w = grid[0].length, h = grid.length;
  canvas.width = w * P; canvas.height = h * P;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = grid[y][x];
    if (ch === ".") {
      ctx.fillStyle = snowBg ? "#FFF1E8" : ((x + y) % 2 ? "#333" : "#3c3c3c");
    } else {
      ctx.fillStyle = PALETTE[ch] || "#f0f";
    }
    ctx.fillRect(x * P, y * P, P, P);
  }
  ctx.strokeStyle = "rgba(128,128,128,0.25)";
  for (let x = 0; x <= w; x++) { ctx.beginPath(); ctx.moveTo(x*P, 0); ctx.lineTo(x*P, h*P); ctx.stroke(); }
  for (let y = 0; y <= h; y++) { ctx.beginPath(); ctx.moveTo(0, y*P); ctx.lineTo(w*P, y*P); ctx.stroke(); }
  // small in-game preview on snow
  const S = 3;
  preview.width = w * S; preview.height = h * S;
  pctx.fillStyle = "#FFF1E8";
  pctx.fillRect(0, 0, preview.width, preview.height);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = grid[y][x];
    if (ch === ".") continue;
    pctx.fillStyle = PALETTE[ch] || "#f0f";
    pctx.fillRect(x * S, y * S, S, S);
  }
  out.value = grid.map(r => r.join("")).join("\n");
}
function cell(ev) {
  const rect = canvas.getBoundingClientRect(), P = pxSize();
  const x = Math.floor((ev.clientX - rect.left) / P);
  const y = Math.floor((ev.clientY - rect.top) / P);
  if (y < 0 || y >= grid.length || x < 0 || x >= grid[0].length) return null;
  return {x, y};
}
function apply(ev) {
  const c = cell(ev);
  if (!c) return;
  grid[c.y][c.x] = drawing === "erase" ? "." : color;
  dirty = true;
  repaint();
}
canvas.addEventListener("contextmenu", ev => ev.preventDefault());
canvas.addEventListener("mousedown", ev => {
  undoStack.push(grid.map(r => r.slice()));
  if (undoStack.length > 200) undoStack.shift();
  drawing = (ev.button === 2 || tool === "eraser") ? "erase" : "paint";
  apply(ev);
});
canvas.addEventListener("mousemove", ev => { if (drawing) apply(ev); });
window.addEventListener("mouseup", () => { drawing = null; });

window.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "z") {
    if (undoStack.length) { grid = undoStack.pop(); dirty = true; repaint(); }
    ev.preventDefault();
  } else if ((ev.ctrlKey || ev.metaKey) && ev.key === "s") {
    save();
    ev.preventDefault();
  } else if (ev.target.tagName !== "TEXTAREA" && ev.target.tagName !== "INPUT") {
    if (ev.key === "e") setTool("eraser");
    else if (ev.key === "p") setTool("pencil");
    else if (ev.key === "[") step(-1);
    else if (ev.key === "]") step(1);
  }
});

// --- sprite catalog ---------------------------------------------------------
const MARGIN = 5;  // transparent working border; the server crops it on save

function loadAscii(text, margin) {
  const lines = text.split("\n").filter(l => l.trim());
  const w = Math.max(...lines.map(l => l.length));
  grid = lines.map(l => l.padEnd(w, ".").split("")
    .map(ch => (ch === "." || PALETTE[ch]) ? ch : "."));
  if (margin) {
    const pad = Array(margin).fill(".");
    grid = grid.map(r => [...pad, ...r, ...pad]);
    const blank = () => Array(grid[0].length).fill(".");
    grid = [...Array.from({length: margin}, blank), ...grid,
            ...Array.from({length: margin}, blank)];
  }
  undoStack = [];
  dirty = false;
  repaint();
}

function show(entry) {
  current = entry;
  pick.value = String(entry.id);
  loadAscii(entry.art, MARGIN);
  const lines = entry.art.split("\n");
  say(entry.name + "  " + lines[0].length + "x" + lines.length
      + (entry.edited ? "  (hand-edited)" : ""));
}

function step(dir) {
  if (!current) return;
  const i = sprites.findIndex(s => s.id === current.id);
  const n = sprites[(i + dir + sprites.length) % sprites.length];
  show(n);
}

function fillSelect(sel) {
  const keep = sel.value;
  sel.innerHTML = "";
  const byGroup = new Map();
  for (const s of sprites) {
    if (!byGroup.has(s.group)) byGroup.set(s.group, []);
    byGroup.get(s.group).push(s);
  }
  for (const [group, list] of byGroup) {
    const og = document.createElement("optgroup");
    og.label = group;
    for (const s of list) {
      const opt = document.createElement("option");
      opt.value = String(s.id);
      opt.textContent = String(s.id).padStart(3, "0") + " " + s.name
        + (s.edited ? " *" : "");
      og.appendChild(opt);
    }
    sel.appendChild(og);
  }
  if (keep) sel.value = keep;
}

function buildDropdown() {
  fillSelect(pick);
  fillSelect(document.getElementById("copyTarget"));
  fillSelect(document.getElementById("mirrorTarget"));
}
pick.onchange = () => {
  const s = sprites.find(x => x.id === +pick.value);
  if (s) show(s);
};
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);

async function loadCatalog() {
  const res = await fetch("/api/sprites");
  const data = await res.json();
  // keep group order stable, skier first
  const order = new Map(data.groups.map((g, i) => [g, i]));
  sprites = data.sprites.slice().sort((a, b) =>
    (order.get(a.group) - order.get(b.group)) || (a.id - b.id));
  buildDropdown();
  show(sprites[0]);
}

// --- save / revert ----------------------------------------------------------
async function save() {
  if (!current) return;
  const res = await fetch("/api/save", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: current.id,
                          art: grid.map(r => r.join("")).join("\n")}),
  });
  const data = await res.json();
  if (!res.ok) { say(data.error || "save failed", true); return; }
  current.art = data.art;   // server-cropped to content
  current.edited = true;
  buildDropdown();
  show(current);
  say(current.name + " saved as " + data.size[0] + "x" + data.size[1]
      + " - game reloaded");
}
document.getElementById("save").onclick = save;

document.getElementById("revert").onclick = async () => {
  if (!current) return;
  const res = await fetch("/api/revert", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: current.id}),
  });
  const data = await res.json();
  if (!res.ok) { say(data.error || "revert failed", true); return; }
  current.art = data.art;
  current.edited = false;
  buildDropdown();
  show(current);
  say(current.name + " reverted to generated art");
};

// Overwrite another sprite with the current canvas (optionally flipped),
// live in the game.
async function sendCanvasTo(selectId, flip, verb) {
  const target = document.getElementById(selectId);
  const tid = +target.value;
  if (!current || !tid) return;
  if (tid === current.id && !flip) { say("that IS the current sprite", true); return; }
  const rows = grid.map(r => flip ? r.slice().reverse().join("") : r.join(""));
  const res = await fetch("/api/save", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: tid, art: rows.join("\n")}),
  });
  const data = await res.json();
  if (!res.ok) { say(data.error || verb + " failed", true); return; }
  const t = sprites.find(s => s.id === tid);
  t.art = data.art;
  t.edited = true;
  buildDropdown();
  pick.value = String(current.id);
  say(verb + " onto " + t.name + " - live in game");
}
document.getElementById("copyTo").onclick = () => sendCanvasTo("copyTarget", false, "copied");
document.getElementById("mirrorTo").onclick = () => sendCanvasTo("mirrorTarget", true, "mirrored");

// --- misc -------------------------------------------------------------------
document.getElementById("copy").onclick = () => {
  out.select();
  navigator.clipboard ? navigator.clipboard.writeText(out.value) : document.execCommand("copy");
  say("copied");
};
document.getElementById("fromText").onclick = () => { loadAscii(out.value); dirty = true; };
document.getElementById("bg").onclick = ev => {
  snowBg = !snowBg;
  ev.target.textContent = "Background: " + (snowBg ? "snow" : "checker");
  repaint();
};
window.addEventListener("beforeunload", ev => {
  if (dirty) ev.preventDefault();
});

loadCatalog().catch(() => say("open this page via tools/edit-sprites (needs the server)", true));
</script>
</body>
</html>
